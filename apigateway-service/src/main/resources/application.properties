spring.application.name=apigateway-service

server.port=8080

spring.config.import=configserver:http://config-server:8888
# Eureka
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true



# User Service Route

spring.cloud.gateway.server.webmvc.routes[0].id=user-service

spring.cloud.gateway.server.webmvc.routes[0].uri=lb://USER-SERVICE

spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**


# Event Service Route

spring.cloud.gateway.server.webmvc.routes[1].id=event-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://EVENT-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/events/**
management.endpoints.web.exposure.include=*

# Booking Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=booking-service

spring.cloud.gateway.server.webmvc.routes[2].uri=lb://BOOKING-SERVICE

spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/bookings/**